# Deploys the already-built image sk-svc:<sha> to one environment with scripts/Invoke-Deploy.ps1:
# migrations first, then docker compose up in the environment's own project, then a health wait,
# then a "deployed" entry in the deploy history. Nothing is rebuilt here.

parameters:
  - name: environment
    type: string
    values: [dev, prod]
  - name: composeProject
    type: string
  - name: sha
    type: string
  - name: failRate
    type: string
    default: '0'

steps:
  # The checkout is fresh, so make sure the shared network, the database password
  # (SKSVC_DB_PASSWORD_FILE, set by scripts/Initialize-AgentHost.ps1) and Postgres are there.
  # Idempotent: when they already exist this changes nothing.
  - pwsh: ./scripts/Start-Stack.ps1 -DataOnly
    displayName: 'Prepare: network, database password, Postgres'

  - pwsh: |
      # Tells a later rollback step that this environment may have changed. Set first, so a
      # step that is cancelled or times out mid-deploy still gets rolled back.
      Write-Output '##vso[task.setvariable variable=deployStarted]true'
      ./scripts/Invoke-Deploy.ps1 -Environment '${{ parameters.environment }}' -ImageTag '${{ parameters.sha }}' -FailRate ${{ parameters.failRate }}
      $code = $LASTEXITCODE
      # Exit 2: migrations failed before anything was deployed. The previous release is still
      # running and healthy, so a rollback would only move the environment further back.
      if ($code -eq 2) {
          Write-Output '##vso[task.setvariable variable=deployStarted]false'
      }
      exit $code
    displayName: 'Deploy: sk-svc:<sha> to ${{ parameters.environment }} (FAIL_RATE=${{ parameters.failRate }})'

  - pwsh: |
      # Show what is running in the project, for the run log.
      docker compose -p '${{ parameters.composeProject }}' ps
    displayName: 'Show: ${{ parameters.composeProject }} containers'
    condition: always()
    continueOnError: true
