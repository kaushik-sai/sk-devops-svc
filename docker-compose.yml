# One Compose file, four profiles, each run as its own Compose project:
#   dev        -> project sksvc-dev   (app-dev on 127.0.0.1:7311)
#   prod       -> project sksvc-prod  (app-prod on 127.0.0.1:7312)
#   data       -> project sksvc-data  (Postgres, no published port)
#   monitoring -> project sksvc-mon   (Prometheus 7390, Grafana 7391, Alertmanager 7393)
# Separate projects let us redeploy or roll back one environment without touching the others.
# Everything joins the shared network sksvc-net, created by scripts/Start-Stack.ps1.
#
# Example: IMAGE_TAG=<sha> docker compose -p sksvc-dev --profile dev up -d app-dev

# Settings shared by both app environments. Only the profile and the host port differ.
x-app: &app
  # Images stay local on the agent (no registry). IMAGE_TAG is the full commit SHA.
  # "unset" makes a forgotten IMAGE_TAG fail loudly ("image not found") instead of running something else.
  image: sk-svc:${IMAGE_TAG:-unset}
  pull_policy: never
  environment:
    FAIL_RATE: ${FAIL_RATE:-0}
    DB_PASSWORD_FILE: /run/secrets/db_password
  secrets:
    - db_password
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 20s
  restart: unless-stopped
  # Hardening: no Linux capabilities and no privilege escalation; the app needs neither.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - sksvc-net

services:
  app-dev:
    <<: *app
    profiles: ["dev"]
    ports:
      - "127.0.0.1:7311:8080"

  app-prod:
    <<: *app
    profiles: ["prod"]
    ports:
      - "127.0.0.1:7312:8080"

  # One Postgres for both environments, with databases svc_dev and svc_prod
  # (created by scripts/Invoke-Migrations.ps1). No published port: only reachable on sksvc-net.
  db:
    image: postgres:16-alpine
    profiles: ["data"]
    container_name: sksvc-db
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # The official image trusts all loopback connections by default, so a wrong password
      # would still work. This makes TCP connections (including 127.0.0.1) check the password.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - sksvc-net

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Local demo: keep two days of data so the disk does not fill up.
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:7390:9090"
    restart: unless-stopped
    networks:
      - sksvc-net

  alertmanager:
    image: prom/alertmanager:v0.34.1
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:7393:9093"
    restart: unless-stopped
    networks:
      - sksvc-net

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["monitoring"]
    environment:
      # Read-only anonymous access, so no password is committed or needed for the demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # No login form and no basic auth: the built-in admin account cannot be used at all.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:7391:3000"
    restart: unless-stopped
    networks:
      - sksvc-net

secrets:
  db_password:
    # Generated by scripts/Start-Stack.ps1 (random, git-ignored).
    file: ./.secrets/db_password

volumes:
  db-data:

networks:
  sksvc-net:
    external: true
